name: CI/CD Pipeline - Kollecta

on:
  push:
    branches: [ master, dev, feature/* ]
    tags: [ 'v*.*.*' ] # Déclenche aussi la publication lors de la création d'un tag Git (ex: v1.0.0)
  pull_request:
    branches: [ master, dev ]

jobs:
  sonarcloud:
    name: Code Quality Analysis (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Analyse SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-test:
    needs: sonarcloud
    name: Build & Test (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            kollecta/package-lock.json

      - name: 3. Test de build avec Docker Compose
        run: docker compose build

      - name: 4. Démarrage des services
        run: docker compose up -d

      - name: 5. Vérification du statut
        run: |
          sleep 10
          docker compose ps

      - name: 6. Application des migrations Prisma
        run: docker compose exec -T server npx prisma db push

      - name: 7. Extinction des services
        if: always()
        run: docker compose down

  publish-images:
    needs: build-and-test
    name: Publish Docker Images with Versioning
    # Publie sur master OU lors d'une release officielle (tag v1.0.0...)
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout du code
        uses: actions/checkout@v4

      - name: 2. Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Génération intelligente des métadonnées et tags pour le Backend
      - name: 3. Génération des tags Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kollecta-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Build et Push Backend
      - name: 4. Build et Push de l'image Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # Génération intelligente des métadonnées et tags pour le Frontend
      - name: 5. Génération des tags Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kollecta-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Build et Push Frontend
      - name: 6. Build et Push de l'image Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./kollecta
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}