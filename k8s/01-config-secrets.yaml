apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: kollecta
type: Opaque
stringData:
  POSTGRES_USER: kollecta_user
  POSTGRES_PASSWORD: kollecta_password_123
  POSTGRES_DB: kollecta_db
  DATABASE_URL: "postgresql://kollecta_user:kollecta_password_123@postgres-service:5432/kollecta_db?schema=public"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kollecta
data:
  PORT: "5000"
  NODE_ENV: "production"